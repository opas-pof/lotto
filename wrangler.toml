name = "lotto-worker"
main = "src/index.ts"
compatibility_date = "2024-11-27"

# Supabase Environment Variables
# สำหรับ local development ใช้ .env หรือ .env.local
# สำหรับ production ใช้ wrangler secret put (แนะนำ)
#
# ⚠️ หมายเหตุ: อย่าใส่ [vars] section ไว้ถ้าใช้ Secrets
# เพราะจะทำให้ Variables ใน Dashboard หายไปเมื่อ deploy
#
# [vars]
# SUPABASE_URL = "https://your-project.supabase.co"  # ไม่แนะนำ - จะ commit ขึ้น git

# Cron Triggers - รันทุกวันจันทร์, พุธ, ศุกร์ เวลา 20:30 น. (ไทย = UTC+7)
# หมายเหตุ: Cloudflare Workers ใช้ UTC time
# 20:30 น. (UTC+7) = 13:30 UTC
# Cloudflare cron: 1=Sunday, 2=Monday, 3=Tuesday, 4=Wednesday, 5=Thursday, 6=Friday, 7=Saturday
[triggers]
crons = ["30 13 * * 2,4,6"] # จันทร์(2), พุธ(4), ศุกร์(6) เวลา 13:30 UTC = 20:30 น. ไทย

# หมายเหตุ: สำหรับ secrets (SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY)
# ใช้คำสั่ง: wrangler secret put <NAME>
# หรือตั้งใน Cloudflare Dashboard > Workers > Settings > Variables
