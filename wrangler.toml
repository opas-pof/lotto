name = "lotto-worker"
main = "src/index.ts"
compatibility_date = "2024-11-27"

# Supabase Environment Variables
# สำหรับ local development ใช้ .env หรือ .env.local
# สำหรับ production ใช้ wrangler secret put
[vars]
# SUPABASE_URL จะถูกโหลดจาก .env.local หรือตั้งเป็น secret
# SUPABASE_URL = "https://your-project.supabase.co"

# Cron Triggers - รันทุกวันจันทร์, พุธ, ศุกร์ เวลา 20:30 (UTC+7 = 13:30 UTC)
# หมายเหตุ: Cloudflare Workers ใช้ UTC time
# 20:30 น. (UTC+7) = 13:30 UTC
[triggers]
crons = ["30 13 * * 1,3,5"] # จันทร์(1), พุธ(3), ศุกร์(5) เวลา 13:30 UTC

# หมายเหตุ: สำหรับ secrets (SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY)
# ใช้คำสั่ง: wrangler secret put <NAME>
# หรือตั้งใน Cloudflare Dashboard > Workers > Settings > Variables
